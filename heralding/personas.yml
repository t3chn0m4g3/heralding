# Coherent system profiles. One is picked at start-up (config key `persona`, default "random").
# Explicit, non-empty values in heralding.yml always override these.
# {hostname}, {domain} and {netbios} are filled in per start.
ubuntu-24.04:
  os_family: linux
  domain: internal
  hostname_pattern: "{role}-{n2}"
  roles: [mail, web, db, app, srv]
  netbios: ""
  cert:
    country: ""
    state: ""
    locality: ""
    organization: ""
    organizational_unit: ""
    common_name: "{hostname}.{domain}"
  capabilities:
    ftp: { banner: "ProFTPD 1.3.8b Server ({hostname})", syst_type: "UNIX Type: L8" }
    telnet: {}
    pop3: { banner: "+OK Dovecot (Ubuntu) ready." }
    imap: { banner: "* OK [CAPABILITY IMAP4rev1 SASL-IR LOGIN-REFERRALS ID ENABLE IDLE LITERAL+ AUTH=PLAIN AUTH=LOGIN] Dovecot (Ubuntu) ready." }
    smtp: { banner: "{hostname}.{domain} ESMTP Postfix (Ubuntu)" }
    http: { banner: "nginx/1.24.0 (Ubuntu)" }
    ssh: { banner: "SSH-2.0-OpenSSH_9.6p1 Ubuntu-3ubuntu13.5" }
    mysql: { version: "8.0.37-0ubuntu0.24.04.1" }
    redis: { version: "7.0.15" }
    vnc: {}
    rdp: {}

