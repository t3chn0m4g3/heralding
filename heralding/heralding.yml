# will request and log the public ip every hours from ipify
public_ip_as_destination_ip: false

# ip address(es) to listen on; a list binds several. The default listens on IPv4 and IPv6;
# without IPv6 on the host the "::" entry is skipped with a warning. IPv4 only: 0.0.0.0
bind_host: ["0.0.0.0", "::"]

# system profile the honeypot presents (banners, versions, host names, certificate subjects).
# "random" picks one of the profiles in heralding/personas.yml once and keeps it in persona.state
# (working directory) across restarts; or name one, e.g.
# ubuntu-24.04, debian-12, rhel-9, windows-server-2019, windows-server-2022.
# Any banner set explicitly below overrides the persona for that capability.
persona: random

# connection limits: new connections beyond these are closed immediately; the per-ip limit
# counts an IPv6 /64 as one source
max_sessions: 800
max_sessions_per_ip: 50

# minimum TLS version for the *s capabilities (ssl.TLSVersion name); can be
# overridden per capability in protocol_specific_data.tls_min_version
tls_min_version: TLSv1_2

# when started as root, drop to this user/group after binding the ports
# user: nobody
# group: nogroup

# logging of sessions and authentication attempts
activity_logging:
  file:
    enabled: true
    # Session details common for all protocols (capabilities) in CSV format, 
    # written to file when the session ends. Set to "" to disable.
    session_csv_log_file: "log_session.csv"
    # Complete session details (including protocol specific data) in JSONL format,
    # written to file when the session ends. Set to "" to disable
    session_json_log_file: "log_session.json"
    # Writes each authentication attempt to file, including credentials,
    # set to "" to disable
    authentication_log_file: "log_auth.csv"

  syslog:
    enabled: false

  hpfeeds:
    enabled: false
    session_channel: "heralding.session"
    auth_channel: "heralding.auth"
    host:
    port: 20000
    ident:
    secret:

  curiosum:
    enabled: false
    port: 23400

hash_cracker:
  enabled: true
  wordlist_file: 'wordlist.txt'

# protocols to enable
capabilities:
  ftp:
    enabled: true
    port: 21
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
      banner: ""
      syst_type: ""

  ftps:
    enabled: true
    port: 990
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
      banner: ""
      syst_type: ""
      cert:
        common_name: "*"
        country: "US"
        state: None
        locality: None
        organization: None
        organizational_unit: None
        valid_days: 365
        serial_number: 0

  telnet:
    enabled: true
    port: 23
    timeout: 30
    protocol_specific_data:
      max_attempts: 3

  pop3:
    enabled: true
    port: 110
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
      banner: ""

  pop3s:
    enabled: true
    port: 995
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
      banner: ""
      # if a .pem file is not found in work dir, a new pem file will be created
      # using these values
      cert:
        common_name: "*"
        country: "US"
        state: None
        locality: None
        organization: None
        organizational_unit: None
        # how many days should the certificate be valid for
        valid_days: 365
        serial_number: 0

  postgresql:
    enabled: true
    port: 5432
    timeout: 30

  imap:
    enabled: true
    port: 143
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
      banner: ""

  imaps:
    enabled: true
    port: 993
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
      banner: ""
      # if a .pem file is not found in work dir, a new pem file will be created
      # using these values
      cert:
        common_name: "*"
        country: "US"
        state: None
        locality: None
        organization: None
        organizational_unit: None
        # how many days should the certificate be valid for
        valid_days: 365
        serial_number: 0

  ssh:
    enabled: true
    port: 22
    timeout: 30
    protocol_specific_data:
      banner: ""

  http:
    enabled: true
    port: 80
    timeout: 30
    protocol_specific_data:
      banner: ""

  https:
    enabled: true
    port: 443
    timeout: 30
    protocol_specific_data:
      banner: ""
      # if a .pem file is not found in work dir, a new pem file will be created
      # using these values
      cert:
        common_name: "*"
        country: "US"
        state: None
        locality: None
        organization: None
        organizational_unit: None
        # how many days should the certificate be valid for
        valid_days: 365
        serial_number: 0

  smtp:
    enabled: true
    port: 25
    timeout: 30
    protocol_specific_data:
      banner: ""
      # If the fqdn option is commented out or empty, then fqdn of the host will be used
      fqdn: ""

  smtps:
    enabled: true
    port: 465
    timeout: 30
    protocol_specific_data:
      banner: ""
      # If the fqdn option is commented out or empty, then fqdn of the host will be used
      fqdn: ""
      cert:
        common_name: "*"
        country: "US"
        state: None
        locality: None
        organization: None
        organizational_unit: None
        # how many days should the certificate be valid for
        valid_days: 365
        serial_number: 0

  submission:
    enabled: true
    port: 587
    timeout: 30
    protocol_specific_data:
      banner: ""
      fqdn: ""
      cert:
        common_name: "*"
        country: "US"
        state: None
        locality: None
        organization: None
        organizational_unit: None
        valid_days: 365
        serial_number: 0

  vnc:
    enabled: true
    port: 5900
    timeout: 30

  socks5:
    enabled: true
    port: 1080
    timeout: 30

  mysql:
    enabled: true
    port: 3306
    timeout: 30
    protocol_specific_data:
      # server version string in the greeting; empty = from persona
      version: ""
    

  redis:
    enabled: true
    port: 6379
    timeout: 30
    protocol_specific_data:
      max_attempts: 10

  sip:
    enabled: true
    port: 5060    # UDP and TCP
    timeout: 30

  mssql:
    enabled: true
    port: 1433
    timeout: 30
    protocol_specific_data:
      # SQL Server version reported in PRELOGIN; empty = from persona
      version: ""
      # the encrypted login uses a certificate named like SQL Server's self-signed one
      # (CN=SSL_Self_Signed_Fallback); a cert: block here replaces it

  ldap:
    enabled: true
    port: 389
    timeout: 30
    protocol_specific_data:
      max_attempts: 10

  ldaps:
    enabled: true
    port: 636
    timeout: 30
    protocol_specific_data:
      max_attempts: 10
      cert:
        common_name: "*"
        country: "US"
        state: None
        locality: None
        organization: None
        organizational_unit: None
        valid_days: 365
        serial_number: 0

  http_proxy:
    enabled: true
    port: 8080
    timeout: 30
    protocol_specific_data:
      # Server header of the proxy; empty = from persona
      banner: ""

  mqtt:
    enabled: true
    port: 1883
    timeout: 30

  mqtts:
    enabled: true
    port: 8883
    timeout: 30
    protocol_specific_data:
      cert:
        common_name: "*"
        country: "US"
        state: None
        locality: None
        organization: None
        organizational_unit: None
        valid_days: 365
        serial_number: 0

  rdp:
    enabled: true
    port: 3389
    timeout: 30
    protocol_specific_data:
      # RDP defaults to TLS <= 1.2 for native-client interoperability.
      # Set tls_max_version: TLSv1_3 to explicitly enable TLS 1.3.
      banner: ""
      # if a .pem file is not found in work dir, a new pem file will be created
      # using these values
      cert:
        common_name: "*"
        country: "US"
        state: None
        locality: None
        organization: None
        organizational_unit: None
        # how many days should the certificate be valid for
        valid_days: 365
        serial_number: 0

  smb:
    enabled: true
    port: 445
    timeout: 30
