# Standalone deployment: docker compose up --build -d
# Override HERALDING_* variables in the shell or a local .env file.
services:
  heralding:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${HERALDING_IMAGE:-heralding:local}"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    stop_grace_period: 30s
    volumes:
      - heralding-logs:/var/log/heralding
      # The image initializes this directory with ownership for its non-root user.
      - heralding-state:/tmp/heralding
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    ports:
      # Bind address defaults to all IPv4 interfaces; host ports can be changed individually.
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_FTP_PORT:-2121}:21/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_SSH_PORT:-2222}:22/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_TELNET_PORT:-2323}:23/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_SMTP_PORT:-2525}:25/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_HTTP_PORT:-8080}:80/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_POP3_PORT:-1110}:110/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_IMAP_PORT:-1143}:143/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_LDAP_PORT:-1389}:389/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_HTTPS_PORT:-8443}:443/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_SMB_PORT:-1445}:445/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_SMTPS_PORT:-2465}:465/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_SUBMISSION_PORT:-2587}:587/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_LDAPS_PORT:-1636}:636/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_FTPS_PORT:-2990}:990/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_IMAPS_PORT:-1993}:993/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_POP3S_PORT:-1995}:995/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_SOCKS5_PORT:-1080}:1080/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_MSSQL_PORT:-1433}:1433/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_MQTT_PORT:-1883}:1883/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_MYSQL_PORT:-3306}:3306/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_RDP_PORT:-3389}:3389/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_SIP_PORT:-5060}:5060/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_SIP_PORT:-5060}:5060/udp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_POSTGRESQL_PORT:-5432}:5432/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_VNC_PORT:-5900}:5900/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_REDIS_PORT:-6379}:6379/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_HTTP_PROXY_PORT:-8888}:8080/tcp"
      - "${HERALDING_BIND_ADDRESS:-0.0.0.0}:${HERALDING_MQTTS_PORT:-8883}:8883/tcp"

volumes:
  heralding-logs:
  heralding-state:
